<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/style.css" />


  <title>Frontend Mentor | NFT preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
</head>

<body class="root">


  <div class="equilibrium_wrapper">
    <div class="equilibrium_1">
      <div class="equilibrium_image">
        <img src="/images/image-equilibrium.jpg" alt="Equilibrium">
      </div>
    </div>


    <div class="equilibrium_2">
      <div class="equilibrium_header">
        <h3> Equilibrium #3429</h3>
      </div>


      <p class="equilibrium_info">
        Our Equilibrium collection promotes balance and calm.
      </p>

      <div class="equilibrium_details">
        <div class="equilibrium_digits">0.041 ETH </div>
        <div class="equilibrium_time"><img src="/images/icon-clock.svg" alt="Clock icon">3 days left</div>
      </div>

      <div class="equilibrium_creator"><img src="/images/image-avatar.png" height="20px" width="20px" /> Creation
        of<span class="creator">Jules Wyvern</span>
      </div>


    </div>

    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
      Coded by <a href="#">Idowu Fasunle</a>.
    </div>
  </div>


</body>

</html>
