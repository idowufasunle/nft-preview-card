<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">

  <!-- <link rel="stylesheet" href="/nft-preview-card/style.css" /> -->


  <title>Frontend Mentor | NFT preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
       <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "light-blue": "hsl(215, 51%, 70%)",
            "primary-white": "hsl(0, 0%, 100%)",
            "light-cyan": "hsl(178, 100%, 50%)",
            "bold-blue": "hsl(215, 32%, 27%)",
            "dark-blue": "hsl(216, 50%, 16%)",
          }
        }
      }
    }
  </script>
</head>

<body class="root">


  <div class="equilibrium_wrapper min-h-dvh flex justify-center items-center gap-6 bg-bold-blue text-light-blue rounded-lg">
    <div class="equilibrium__card bg-dark-blue p-6 rounded-xl md:max-w-sm lg:max-w-md mx-10"> 
    <div class="equilibrium_1">
      <div class="equilibrium_image rounded-xl overflow-hidden">
        <img src="/nft-preview-card/images/image-equilibrium.jpg" alt="A geometric cube">
      </div>
    </div>


    <div class="equilibrium_2 flex flex-col gap-5 py-5">
      <div class="equilibrium_header text-2xl font-bold text-primary-white">
        <h3> Equilibrium #3429</h3>
      </div>


      <p class="equilibrium_info text-lg">
        Our Equilibrium collection promotes balance and calm.
      </p>

      <div class="equilibrium_details flex justify-between items-center border-b border-b-light-blue/40 pb-5">
        <div class="equilibrium_digits flex text-xl font-bold text-light-cyan gap-2"><img src="/nft-preview-card/images/icon-ethereum.svg" alt="Etherium image">0.041 ETH </div>
        <div class="equilibrium_time flex gap-2"><img src="/nft-preview-card/images/icon-clock.svg" alt="Clock icon">3 days left</div>
      </div>

      <div class="equilibrium_creator flex gap-2"><img class="rounded-full border" src="/nft-preview-card/images/image-avatar.png" height="20px" width="20px"/>Creation
        of <span class="creator font-semibold text-primary-white">Jules Wyvern</span>
      </div>


    </div>

    <!-- <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
      Coded by <a href="#">Idowu Fasunle</a>. -->
    </div>
    </div>
  </div>


</body>

</html>
